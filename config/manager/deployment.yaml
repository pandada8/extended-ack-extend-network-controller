apiVersion: v1
kind: Namespace
metadata:
  name: pod-nat-eip-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-nat-eip-controller
  namespace: pod-nat-eip-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-nat-eip-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-nat-eip-controller
subjects:
- kind: ServiceAccount
  name: pod-nat-eip-controller
  namespace: pod-nat-eip-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-nat-eip-controller
  namespace: pod-nat-eip-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-nat-eip-controller
  template:
    metadata:
      labels:
        app: pod-nat-eip-controller
    spec:
      serviceAccountName: pod-nat-eip-controller
      containers:
      - name: manager
        image: ghcr.io/pandada8/extended-ack-exteneded-network-controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        env:
        - name: ALIBABA_CLOUD_REGION_ID
          value: cn-hangzhou
        - name: ALIBABA_CLOUD_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: alibaba-cloud-credentials
              key: accessKeyId
        - name: ALIBABA_CLOUD_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: alibaba-cloud-credentials
              key: accessKeySecret
        - name: ALIBABA_CLOUD_SECURITY_TOKEN
          valueFrom:
            secretKeyRef:
              name: alibaba-cloud-credentials
              key: securityToken
              optional: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
